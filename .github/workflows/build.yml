name: Build Android App Bundle & APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Create Bundle Directory
        run: mkdir -p android/app/src/main/assets

      - name: Generate Offline JS Bundle
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ || npx expo export --platform android

      - name: Generate Release Keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore \
            -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "MySecurePassword123" -keypass "MySecurePassword123" \
            -dname "CN=Career Buddy, OU=App, O=Company, L=City, S=State, C=IN"

      - name: Configure Release Signing in Gradle
        working-directory: android/app
        run: |
          cat << 'EOF' > update_signing.py
          with open("build.gradle", "r") as f:
              content = f.read()

          release_signing = """
                  release {
                      storeFile file('release.keystore')
                      storePassword 'MySecurePassword123'
                      keyAlias 'my-key-alias'
                      keyPassword 'MySecurePassword123'
                  }
          """
          
          if "signingConfigs {" in content:
              content = content.replace("signingConfigs {", "signingConfigs {" + release_signing, 1)

          with open("build.gradle", "w") as f:
              f.write(content)
          EOF
          python3 update_signing.py

      - name: Build Both AAB & APK
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: career-buddy-test-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: career-buddy-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          
