name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Create Bundle Directory
        run: mkdir -p android/app/src/main/assets

      - name: Generate Offline JS Bundle
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ || npx expo export --platform android

      - name: Configure Debug Keystore for Release
        working-directory: android/app
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle || true

      - name: Build Standalone APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: career-buddy-apk
          path: android/app/build/outputs/apk/release/*.apk
          
