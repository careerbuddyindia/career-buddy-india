name: Build Android App Bundle & APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Create Bundle Directory
        run: mkdir -p android/app/src/main/assets

      - name: Generate Offline JS Bundle
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ || npx expo export --platform android

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore \
            -alias careerbuddy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Career Buddy, OU=Mobile, O=CareerBuddy, L=Delhi, ST=Delhi, C=IN"
      - name: Export Upload Certificate for Play Store
        run: |
         keytool -export -rfc -keystore release.keystore -alias careerbuddy -file upload_cert.pem -storepass android123

      - name: Upload Certificate to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playstore-upload-cert
          path: upload_cert.pem
                release.keystore
                
      - name: Force Release Signing Configuration in Gradle
        working-directory: android/app
        run: |
          cp ../../release.keystore ./release.keystore
          cat << 'EOF' > patch_gradle.py
          with open("build.gradle", "r") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if "signingConfigs {" in line:
                  new_lines.append(line)
                  new_lines.append("""
                  release {
                      storeFile file('release.keystore')
                      storePassword 'android123'
                      keyAlias 'careerbuddy'
                      keyPassword 'android123'
                  }
          """)
              elif "signingConfig signingConfigs.debug" in line:
                  new_lines.append("            signingConfig signingConfigs.release\n")
              else:
                  new_lines.append(line)

          with open("build.gradle", "w") as f:
              f.writelines(new_lines)
          EOF
          python3 patch_gradle.py

      - name: Build Both AAB & APK
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: career-buddy-test-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: career-buddy-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          
